<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Escanear factura · Montes Chaqueños</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/hoja.js"></script>
<style>
  :root {
    --fondo: #0d0d0d; --texto: #fff; --ok: #3ddc84; --aviso: #ffcc33; --mal: #ff6b5b;
    --boton: var(--tg-theme-button-color, #2a9df4); --boton-texto: var(--tg-theme-button-text-color, #fff);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #escena { position: fixed; inset: 0; }
  video, #marco, #vista { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #vista { object-fit: contain; background: #000; display: none; }
  #consejo {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%); max-width: 92%;
    padding: 10px 18px; border-radius: 999px; background: rgba(0,0,0,.65); font-weight: 600; font-size: 17px;
    text-align: center; transition: background .2s;
  }
  #consejo.ok { background: rgba(28,140,74,.9); }
  #barra {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(18px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,.85) 35%); display: flex; flex-direction: column; gap: 12px;
  }
  #provs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  #provs::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 7px 13px; border-radius: 999px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); color: #fff; font-size: 14px; }
  .chip.sel { background: #fff; color: #111; border-color: #fff; font-weight: 600; }
  #controles { display: flex; align-items: center; justify-content: space-between; }
  .redondo { width: 52px; height: 52px; border-radius: 50%; border: none; background: rgba(255,255,255,.14); color: #fff; font-size: 22px; }
  .redondo.activo { background: var(--aviso); color: #111; }
  #disparo { width: 78px; height: 78px; border-radius: 50%; border: 5px solid #fff; background: rgba(255,255,255,.25); position: relative; }
  #disparo.listo { background: var(--ok); }
  #disparo .anillo { position: absolute; inset: -11px; border-radius: 50%; border: 4px solid var(--ok); opacity: 0; }
  #disparo.contando .anillo { opacity: 1; animation: carga 1.1s linear forwards; }
  @keyframes carga { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
  #auto { font-size: 13px; width: auto; padding: 0 14px; border-radius: 999px; }
  #revisar { display: none; gap: 10px; }
  #revisar button, #final button { flex: 1; padding: 15px; border-radius: 14px; border: none; font-size: 17px; font-weight: 600; }
  .primario { background: var(--boton); color: var(--boton-texto); }
  .secundario { background: rgba(255,255,255,.14); color: #fff; }
  #final { display: none; position: fixed; inset: 0; background: var(--fondo); flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 28px; text-align: center; }
  #final .grande { font-size: 56px; }
  #final .botones { display: flex; gap: 10px; width: 100%; max-width: 420px; }
  #error { display: none; position: fixed; inset: 0; background: var(--fondo); padding: 32px 24px; text-align: center; flex-direction: column; justify-content: center; gap: 14px; }
</style>
</head>
<body>
<div id="escena">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="marco"></canvas>
  <img id="vista" alt="Foto recortada">
  <div id="consejo">Abriendo la cámara…</div>
  <div id="barra">
    <div id="provs"></div>
    <div id="controles">
      <button id="luz" class="redondo" title="Linterna" style="visibility:hidden">🔦</button>
      <button id="disparo" aria-label="Sacar foto"><span class="anillo"></span></button>
      <button id="auto" class="redondo activo">AUTO</button>
    </div>
    <div id="revisar">
      <button id="repetir" class="secundario">↺ Repetir</button>
      <button id="mandar" class="primario">✅ Mandar al bot</button>
    </div>
  </div>
</div>
<div id="final">
  <div class="grande">✅</div>
  <div id="finalTexto"><b>Factura mandada.</b><br>Volvé al chat: el bot ya la está leyendo.</div>
  <div class="botones">
    <button id="otra" class="secundario">📷 Otra factura</button>
    <button id="cerrar" class="primario">Listo</button>
  </div>
</div>
<div id="error"><div style="font-size:48px">📷</div><div id="errorTexto"></div></div>

<script>
(function () {
  'use strict';
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#0d0d0d'); tg.setBackgroundColor('#0d0d0d'); } catch (e) {} }

  const q = new URLSearchParams(location.search);
  const TOKEN = q.get('t') || '';
  const API = q.get('api') || 'https://kvobkqaujufugdyxxovb.supabase.co/functions/v1/escaneo';
  const PROVS = (q.get('p') || '').split('|').map(s => s.trim()).filter(Boolean);

  const $ = id => document.getElementById(id);
  const video = $('video'), marco = $('marco'), vista = $('vista'), consejo = $('consejo');
  const disparo = $('disparo'), autoBtn = $('auto'), luzBtn = $('luz');
  const chico = document.createElement('canvas');
  let stream = null, track = null, auto = true, linterna = false, proveedor = '';
  let buenos = 0, ultimaDeteccion = null, enRevision = false, fotoLista = null, analizando = false;

  function vibrar(tipo) { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(tipo); } catch (e) {} }
  function mostrarError(texto) { $('errorTexto').innerHTML = texto; $('error').style.display = 'flex'; }

  // Proveedor (opcional): así el bot no te pregunta de quién es
  if (PROVS.length) {
    for (const p of PROVS) {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = p;
      b.onclick = () => {
        proveedor = proveedor === p ? '' : p;
        for (const c of document.querySelectorAll('.chip')) c.classList.toggle('sel', c.textContent === proveedor);
      };
      $('provs').appendChild(b);
    }
  } else $('provs').style.display = 'none';

  if (!TOKEN) { mostrarError('Abrí la cámara desde el bot, con el comando <b>/escanear</b>.'); return; }

  async function abrirCamara() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2160 } }
      });
    } catch (e) {
      mostrarError('No pude abrir la cámara.<br><br>Fijate que Telegram tenga permiso de cámara (Ajustes del teléfono → Aplicaciones → Telegram → Permisos) y volvé a abrirla con <b>/escanear</b>.');
      return;
    }
    video.srcObject = stream;
    track = stream.getVideoTracks()[0];
    try {
      const cap = track.getCapabilities ? track.getCapabilities() : {};
      if (cap.torch) luzBtn.style.visibility = 'visible';
      if (cap.focusMode && cap.focusMode.includes('continuous')) await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
    } catch (e) {}
    await video.play().catch(() => {});
    requestAnimationFrame(dibujar);
    setInterval(analizar, 280);
  }

  // Dónde cae el video en la pantalla (object-fit: cover)
  function encuadre() {
    const vw = video.videoWidth, vh = video.videoHeight, cw = marco.clientWidth, ch = marco.clientHeight;
    const esc = Math.max(cw / vw, ch / vh);
    return { esc, dx: (cw - vw * esc) / 2, dy: (ch - vh * esc) / 2, vw, vh };
  }

  function analizar() {
    if (enRevision || analizando || !video.videoWidth) return;
    analizando = true;
    try {
      const ancho = 240, alto = Math.round(ancho * video.videoHeight / video.videoWidth);
      chico.width = ancho; chico.height = alto;
      const c = chico.getContext('2d', { willReadFrequently: true });
      c.drawImage(video, 0, 0, ancho, alto);
      const d = Hoja.detectar(c.getImageData(0, 0, ancho, alto));
      const k = Hoja.consejo(d);
      ultimaDeteccion = d;
      consejo.textContent = k.texto;
      consejo.classList.toggle('ok', k.ok);
      disparo.classList.toggle('listo', k.ok);
      buenos = k.ok ? buenos + 1 : 0;
      if (auto && buenos === 1) disparo.classList.add('contando');
      if (!k.ok) disparo.classList.remove('contando');
      if (auto && buenos >= 4) { buenos = 0; disparo.classList.remove('contando'); sacar(); }
    } finally { analizando = false; }
  }

  function dibujar() {
    const dpr = window.devicePixelRatio || 1;
    if (marco.width !== marco.clientWidth * dpr) { marco.width = marco.clientWidth * dpr; marco.height = marco.clientHeight * dpr; }
    const c = marco.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, marco.clientWidth, marco.clientHeight);
    const d = ultimaDeteccion;
    if (!enRevision && d && d.hoja && video.videoWidth) {
      const e = encuadre();
      const x = e.dx + d.hoja.x * e.vw * e.esc, y = e.dy + d.hoja.y * e.vh * e.esc;
      const w = d.hoja.w * e.vw * e.esc, h = d.hoja.h * e.vh * e.esc;
      const ok = Hoja.consejo(d).ok;
      c.fillStyle = ok ? 'rgba(61,220,132,.12)' : 'rgba(255,204,51,.10)';
      c.fillRect(x, y, w, h);
      c.strokeStyle = ok ? '#3ddc84' : '#ffcc33';
      c.lineWidth = 4;
      const L = Math.min(w, h) * 0.18;
      c.beginPath();
      for (const [px, py, sx, sy] of [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]]) {
        c.moveTo(px + sx * L, py); c.lineTo(px, py); c.lineTo(px, py + sy * L);
      }
      c.stroke();
    }
    requestAnimationFrame(dibujar);
  }

  // Foto a máxima resolución (si el teléfono deja) o el cuadro del video
  async function cuadroGrande() {
    if (window.ImageCapture && track) {
      try {
        const blob = await new ImageCapture(track).takePhoto();
        const bmp = await createImageBitmap(blob);
        if (bmp.width >= video.videoWidth) return bmp;
      } catch (e) {}
    }
    return video;
  }

  async function sacar() {
    if (enRevision) return;
    enRevision = true;
    vibrar('success');
    consejo.textContent = 'Recortando…';
    const fuente = await cuadroGrande();
    const W = fuente.videoWidth || fuente.width, H = fuente.videoHeight || fuente.height;
    const lienzo = document.createElement('canvas');
    lienzo.width = W; lienzo.height = H;
    const c = lienzo.getContext('2d', { willReadFrequently: true });
    c.drawImage(fuente, 0, 0, W, H);
    let img = c.getImageData(0, 0, W, H);
    const d = Hoja.detectar(img);
    if (d.recortar) img = Hoja.recortar(img, d.hoja);
    // Hasta 2400 px de lado largo (la letra se lee bien y la foto no pesa demasiado)
    const f = Math.min(1, 2400 / Math.max(img.width, img.height));
    const tmp = document.createElement('canvas');
    tmp.width = img.width; tmp.height = img.height;
    tmp.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(img.data), img.width, img.height), 0, 0);
    const out = document.createElement('canvas');
    out.width = Math.round(img.width * f); out.height = Math.round(img.height * f);
    const oc = out.getContext('2d');
    oc.imageSmoothingQuality = 'high';
    oc.drawImage(tmp, 0, 0, out.width, out.height);
    fotoLista = out.toDataURL('image/jpeg', 0.9);
    vista.src = fotoLista;
    vista.style.display = 'block';
    video.style.visibility = 'hidden';
    consejo.textContent = d.recortar ? 'Así quedó recortada. ¿Se lee bien?' : '¿Se lee bien?';
    consejo.classList.remove('ok');
    $('controles').style.display = 'none';
    $('revisar').style.display = 'flex';
  }

  function repetir() {
    enRevision = false; fotoLista = null; buenos = 0;
    vista.style.display = 'none'; video.style.visibility = 'visible';
    $('revisar').style.display = 'none'; $('controles').style.display = 'flex';
    consejo.textContent = 'Apuntá a la factura';
  }

  async function mandar() {
    if (!fotoLista) return;
    const btn = $('mandar');
    btn.disabled = true; btn.textContent = 'Mandando…';
    try {
      const r = await fetch(API, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ t: TOKEN, imagen: fotoLista.split(',')[1], proveedor })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || 'No se pudo mandar (' + r.status + ')');
      vibrar('success');
      $('finalTexto').innerHTML = '<b>Factura mandada.</b><br>Volvé al chat: el bot ya la está leyendo' + (proveedor ? ' (' + proveedor + ')' : '') + '.';
      $('final').style.display = 'flex';
    } catch (e) {
      vibrar('error');
      consejo.textContent = '⚠️ ' + e.message;
      btn.disabled = false; btn.textContent = '✅ Mandar al bot';
    }
  }

  disparo.onclick = () => { buenos = 0; disparo.classList.remove('contando'); sacar(); };
  autoBtn.onclick = () => { auto = !auto; autoBtn.classList.toggle('activo', auto); buenos = 0; disparo.classList.remove('contando'); };
  luzBtn.onclick = async () => {
    linterna = !linterna;
    try { await track.applyConstraints({ advanced: [{ torch: linterna }] }); luzBtn.classList.toggle('activo', linterna); } catch (e) {}
  };
  $('repetir').onclick = repetir;
  $('mandar').onclick = mandar;
  $('otra').onclick = () => { $('final').style.display = 'none'; $('mandar').disabled = false; $('mandar').textContent = '✅ Mandar al bot'; repetir(); };
  $('cerrar').onclick = () => { if (tg) tg.close(); else window.close(); };

  abrirCamara();
})();
</script>
</body>
</html>
